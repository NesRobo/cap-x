services:
  capx:
    build:
      context: .
      dockerfile: Dockerfile

    image: capx:dev
    container_name: capx-dev

    # Give the container access to NVIDIA GPUs
    gpus: all

    # Keep stdin + terminal available for interactive development
    stdin_open: true
    tty: true

    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics

    volumes:
      # Persistent HuggingFace model cache
      - hf-cache:/root/.cache/huggingface

      # Persistent uv cache
      - uv-cache:/root/.cache/uv

    working_dir: /workspace/cap-x

    command: /bin/bash

volumes:
  hf-cache:
  uv-cache: